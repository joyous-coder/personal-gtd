name: gtd
description: personal-gtd 总入口：判断意图后进入对应模式
skills:
  - personal-gtd
instruction: |
  使用 personal-gtd 的总入口。先读 SKILL.md 的模式分流表，把用户输入归到某一模式
  （收集 / 计划 / 执行 / 日结 / 周结 / 月结 / 查询 / 对账 / 初始化）；判断不了就问用户是哪一段，不要猜。
  再读该模式的 reference（references/capture.md / plan.md / execute.md / review.md / scoring.md / writing.md）执行。
  写入滴答或笔记前给确认卡；收尾时按 SKILL.md 铁律提示下一阶段，只提示不自动执行。
